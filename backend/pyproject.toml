[project]
name = "sandcastle-backend"
version = "0.1.0"
description = "AI coding-agent evaluation platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "python-dotenv>=1.0.1",
    "websockets>=13.1",
    "httpx>=0.27.2",
    "anthropic>=1.6.0",
    "google-genai>=1.0.0",
    "docker>=7.1.0",
    # Optional at runtime: tracing stays off unless the Langfuse keys are set,
    # and the SDK is imported lazily so an untraced run never loads it.
    "langfuse>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sandbox: needs a reachable Docker endpoint; run in the worker container",
]
